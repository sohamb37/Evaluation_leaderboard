<!-- <!DOCTYPE html> -->
{% extends "base.html" %} {% block title %}Add Model{% endblock %} {% block
    content %}
    <form action="/upload_model" method="POST" enctype="multipart/form-data">
        <h3 align="center">Add Model</h3>
        <div class="form-group">
          <label for="benchmark">Benchmark</label>
          <!-- <input
            type="text"
            class="form-control"
            id="benchmark"
            name="benchmark"
            placeholder="Choose Benchmark"
          /> -->
          <select class="form-control" id="benchmark" name="benchmark">
            <option value="">Select a Dataset</option>
            {% for dataset in datasets %}
                <option value="{{ dataset.name }}">{{ dataset.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
            <label for="model_name">Model Name</label>
            <input
              type="text"
              class="form-control"
              id="model_name"
              name="model_name"
              placeholder="Enter model name"
            />
          </div>
          <div class="form-group">
            <label for="n_parameters">Number of Parameters</label>
            <input
              type="text"
              class="form-control"
              id="n_parameters"
              name="n_parameters"
              placeholder="Enter number of parameters"
            />
          </div>
          <div class="form-group">
            <label for="model_output">Model Output</label>
            <input
              type="file"
              class="form-control"
              id="model_output"
              name="model_output"
              accept=".txt"
              required
            />
          </div>
          <div class="form-group">
            <label for="paperName">Paper Name</label>
            <input
              type="text"
              class="form-control"
              id="paperName"
              name="paperName"
              placeholder="Enter paper name"
            />
          </div>
          <div class="form-group">
            <label for="publicationYear">Publication Year</label>
            <input
              type="number"
              class="form-control"
              id="publicationYear"
              name="publicationYear"
              min="1900"
              max="2099"
              step="1"
              value="2024"
            />
          </div>
          <div class="form-group">
            <label for="codeLink">Code Link</label>
            <input
              type="url"
              class="form-control"
              id="codeLink"
              name="codeLink"
              placeholder="Enter the Code Link"
            />
          </div>
          <br />
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
    {% endblock %}
