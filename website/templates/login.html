<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        .modal {
            display: none; /* Hidden by default */
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5); /* Black background with opacity */
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            position: relative; /* Set position to relative to position children absolutely */
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            width: 75%; /* Adjust the width to be a percentage of the viewport */
            max-width: 400px; /* Max width to prevent excessive expansion */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Optional: add shadow for better visibility */
            text-align: center; /* Center text horizontally */
            display: flex; /* Use flexbox to center content vertically */
            flex-direction: column; /* Arrange children in a column */
            justify-content: center; /* Center content vertically */
            align-items: center; /* Center content horizontally */
        }

        .modal-header, .modal-footer {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .modal-footer {
            border-bottom: none;
        }

        .close {
            color: #aaa;
            position: absolute; /* Absolute position relative to .modal-content */
            top: 10px; /* Distance from the top */
            right: 10px; /* Distance from the right */
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
        }
    </style>
</head>
<body>

{% extends "base.html" %}

{% block title %}Login{% endblock %} {% block content
    %}
<div class="form-container center">
    <form method="POST">
      <h3 align="center">Login</h3>
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          class="form-control"
          id="username"
          name="username"
          placeholder="Enter username"
        />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          class="form-control"
          id="password"
          name="password"
          placeholder="Enter password"
        />
      </div>
       <div class="form-group">
           <label for="user_role">User Role</label>
           <select class="form-control" id="user_role" name="user_role">
            <option value="admin">admin</option>
            <option value="dev">dev</option>
          </select>
       </div>
      <br />
      <button type="submit" class="btn btn-primary">Login</button>
    </form>
</div>
<div id="myModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="close" id="closeModal">&times;</span>
                <h2>Login Status</h2>
            </div>
            <div class="modal-body">
                <p id="modalMessage">{{ message }}</p>
            </div>
            <div class="modal-footer">
                <button id="closeModalFooter">Close</button>
            </div>
        </div>
    </div>
   <script>
        // Function to open modal
        function openModal() {
            document.getElementById('myModal').style.display = 'flex';
        }

        // Function to close modal
        function closeModal() {
            document.getElementById('myModal').style.display = 'none';
            window.location.href = '/home';
        }

        // Show the modal if there's a message
        window.onload = function() {
            if (document.getElementById('modalMessage').textContent) {
                openModal();
            }
        };

        document.getElementById('closeModal').onclick = closeModal;
        document.getElementById('closeModalFooter').onclick = closeModal;

        // Close modal when clicking outside of it
        window.onclick = function(event) {
            if (event.target === document.getElementById('myModal')) {
                closeModal();
            }
        }
    </script>
    {% endblock %}
</body>
</html>
