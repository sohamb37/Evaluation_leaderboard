<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        .modal {
            display: none; /* Hidden by default */
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5); /* Black background with opacity */
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            position: relative; /* Set position to relative to position children absolutely */
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            width: 75%; /* Adjust the width to be a percentage of the viewport */
            max-width: 400px; /* Max width to prevent excessive expansion */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Optional: add shadow for better visibility */
            text-align: center; /* Center text horizontally */
            display: flex; /* Use flexbox to center content vertically */
            flex-direction: column; /* Arrange children in a column */
            justify-content: center; /* Center content vertically */
            align-items: center; /* Center content horizontally */
        }

        .modal-header, .modal-footer {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .modal-footer {
            border-bottom: none;
        }

        .close {
            color: #aaa;
            position: absolute; /* Absolute position relative to .modal-content */
            top: 10px; /* Distance from the top */
            right: 10px; /* Distance from the right */
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
        }
    </style>
</head>
<body>
{% extends "base.html" %} {% block title %}Sign Up{% endblock %} {% block
    content %}
<div class="form-container center">
    <form action = "/add_user" method="POST">
      <h3 align="center">Sign Up</h3>
      <div class="form-group">
        <label for="username">User Name</label>
        <input
          type="text"
          class="form-control"
          id="username"
          name="username"
          placeholder="Enter Unique Username"
        />
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          class="form-control"
          id="email"
          name="email"
          placeholder="Enter email"
        />
      </div>
      <div class="form-group">
        <label for="firstName">First Name</label>
        <input
          type="text"
          class="form-control"
          id="firstName"
          name="firstName"
          placeholder="Enter first name"
        />
      </div>
      <div class="form-group">
        <label for="password1">Password</label>
        <input
          type="password"
          class="form-control"
          id="password1"
          name="password1"
          placeholder="Enter password"
        />
      </div>
      <div class="form-group">
        <label for="password2">Password (Confirm)</label>
        <input
          type="password"
          class="form-control"
          id="password2"
          name="password2"
          placeholder="Confirm password"
        />
      </div>
      <br />
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>
    <div id="myModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="close" id="closeModal">&times;</span>
                <h2>Signup Status</h2>
            </div>
            <div class="modal-body">
                <p id="modalMessage">{{ message }}</p>
            </div>
            <div class="modal-footer">
                <button id="closeModalFooter">Close</button>
            </div>
        </div>
    </div>
   <script>
        // Function to open modal
        function openModal() {
            document.getElementById('myModal').style.display = 'flex';
        }

        // Function to close modal
        function closeModal() {
            document.getElementById('myModal').style.display = 'none';
        }

        // Show the modal if there's a message
        window.onload = function() {
            if (document.getElementById('modalMessage').textContent) {
                openModal();
            }
        };

        document.getElementById('closeModal').onclick = closeModal;
        document.getElementById('closeModalFooter').onclick = closeModal;

        // Close modal when clicking outside of it
        window.onclick = function(event) {
            if (event.target === document.getElementById('myModal')) {
                closeModal();
            }
        }
    </script>
    {% endblock %}
</body>
</html>
